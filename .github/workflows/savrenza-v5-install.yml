# SAVRENZA GROUP V5 installer, revision 2.
# Upload this file to .github/workflows/ to replace the previous version.
# The compressed release is stored in comments below, not in the run command.
# No API keys or passwords are required. Existing Cloudflare Git integration is retained.
name: Install SAVRENZA GROUP V5
on:
  push:
    branches: [main]
    paths: [.github/workflows/savrenza-v5-install.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: savrenza-v5-install
  cancel-in-progress: false
jobs:
  update-site:
    if: github.repository == 'salihasanbusiness-blip/savrenza-energy-site' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read current main
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Verify and apply the embedded release
        shell: python
        run: |
          import base64, hashlib, json, os, stat, subprocess, zlib
          from pathlib import Path, PurePosixPath
          release_workflow=Path('.github/workflows/savrenza-v5-install.yml')
          prefix='# SAVRENZA_PAYLOAD '
          PAYLOAD=''.join(line[len(prefix):].strip() for line in release_workflow.read_text().splitlines() if line.startswith(prefix))
          assert PAYLOAD, 'The embedded release is missing from this workflow file'
          assert hashlib.sha256(base64.b64decode(PAYLOAD)).hexdigest() == 'cfdd75bdd9753346214c34817872afce4dfe785ff7228ccbd27db26f5a4f94b2', 'Release checksum mismatch'
          root=Path.cwd().resolve()
          repository=subprocess.check_output(['git','rev-parse','--show-toplevel'],text=True).strip()
          assert Path(repository).resolve()==root, 'Run from the repository root'
          files=json.loads(zlib.decompress(base64.b64decode(PAYLOAD)))
          pending=[]
          for item in files:
              relative=PurePosixPath(item['path'])
              assert not relative.is_absolute() and '..' not in relative.parts, 'Unsafe release path'
              assert not any(part.startswith('.') for part in relative.parts), 'Hidden paths are outside this release'
              target=root.joinpath(*relative.parts)
              assert target.resolve().is_relative_to(root), 'Release path escapes checkout'
              assert not target.is_symlink(), 'Refusing to replace a symbolic link'
              data=base64.b64decode(item['content'],validate=True)
              assert hashlib.sha256(data).hexdigest()==item['after'], 'Invalid release file'
              current=hashlib.sha256(target.read_bytes()).hexdigest() if target.is_file() else None
              if current==item['after']:continue
              if current!=item['before']:
                  raise SystemExit('Repository changed since the supplied ZIP. No files were updated. Conflicting file: '+item['path'])
              pending.append((target,data))
          for target,data in pending:
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(data)
          print('Applied SAVRENZA GROUP V5: '+str(len(pending))+' files updated.')
      - name: Check release files and interactions
        run: |
          python3 scripts/check_assets.py
          python3 scripts/check_site.py
          node --check assets/savrenza-v5.js
          node scripts/check_interactions.cjs
          node --input-type=module --check < _worker.js
      - name: Commit the updated site to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 404.html README.md START_HERE_V5_BG.md assets/architecture-v5.svg assets/energy-v5.svg assets/savrenza-v5.css assets/savrenza-v5.js assets/social-v5.png index.html manifest.webmanifest privacy.html scripts/check_interactions.cjs scripts/check_site.py sitemap.xml terms.html version.json
          if git diff --cached --quiet; then
            echo "SAVRENZA GROUP V5 is already installed."
            exit 0
          fi
          git commit -m "Update SAVRENZA GROUP website to V5"
          git push origin HEAD:main
          echo "Site files updated. Check the existing Cloudflare Pages project for its deployment status."

